name: aisstream live collect

# Public repo. Single websocket at a time (free aisstream.io rejects
# overlaps with HTTP 429).
#
# Continuous SoCal offshore day, overnight off. GitHub-hosted jobs cap at
# 6 hours, so the day is three abutting runs (not one 15h job):
#   12:00 UTC  5:00 AM PDT / 4:00 AM PST  departures, collect 5.25h
#   17:00 UTC  10:00 AM PDT / 9:00 AM PST mid-morning handoff, collect 5.25h
#   22:00 UTC  3:00 PM PDT / 2:00 PM PST   afternoon through returns, collect 5h
# Span when crons are on time: 12:00–03:00 UTC = 5:00 AM–8:00 PM PDT
# (4:00 AM–7:00 PM PST). The first two runs stay connected 15 minutes past
# the next cron so a slightly late schedule does not open a hole.
# cancel-in-progress hands off; the socket drops only for the next runner's
# checkout and install. Shards land on Release tag aisstream-live.

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"
    - cron: "0 22 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/aisstream-collect.yml"
      - "scripts/collect_aisstream.py"
      - "scripts/config.py"
      - "scripts/upload_live_shards.sh"
      - "deploy/accepted_names.json"
  pull_request:
    paths:
      - ".github/workflows/aisstream-collect.yml"
      - "scripts/collect_aisstream.py"
      - "scripts/config.py"
      - "scripts/upload_live_shards.sh"
      - "deploy/accepted_names.json"
  workflow_dispatch:
    inputs:
      hours:
        description: "Hours for this run (0 = until cancelled / step timeout). One job cannot cover the whole fishing day (6h runner cap); the schedule uses three abutting runs."
        required: false
        default: "5.25"

permissions:
  contents: write

concurrency:
  group: aisstream-collect
  cancel-in-progress: true

env:
  LIVE_RELEASE: aisstream-live
  AISSTREAM_HOST: github-actions-public
  # Morning and midday segments. 15 minutes longer than the 5h gap to
  # the next cron so the socket is still up for the handoff.
  SCHEDULE_HOURS: "5.25"
  # 22:00–03:00 UTC. No following cron.
  SCHEDULE_HOURS_LAST: "5"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AISSTREAM_API_KEY
        id: key
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AISSTREAM_API_KEY}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add repo secret AISSTREAM_API_KEY (https://aisstream.io/ → API Keys). Collection skipped."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::AISSTREAM_API_KEY is not set."
              exit 1
            fi
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ steps.key.outputs.present == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        if: ${{ steps.key.outputs.present == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect live AIS
        id: collect
        # Step timeout (not job timeout) so always() upload can still run.
        timeout-minutes: 340
        if: ${{ steps.key.outputs.present == 'true' }}
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GitHub SIGTERMs the process group on cancel/preempt. Trap it in
          # bash so we survive long enough for Python to flush and for us to
          # upload. Run 34336864840 flushed 205 rows then skipped always()
          # upload, concluding failure and emailing "Run failed".
          on_term() {
            echo "step received SIGTERM; waiting for collector flush + upload…"
          }
          trap on_term TERM INT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            HOURS="${{ github.event.inputs.hours }}"
            HOURS="${HOURS:-0}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # Short live smoke so PRs prove collect+upload without waiting out a segment.
            HOURS="0.05"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 22 * * *" ]; then
            HOURS="${SCHEDULE_HOURS_LAST}"
          else
            # schedule (12:00 and 17:00 UTC) and push: one segment.
            HOURS="${SCHEDULE_HOURS}"
          fi
          echo "collect hours=${HOURS} event=${{ github.event_name }}"

          mkdir -p data/processed/ais_live docs/data
          collect_rc=0
          python3 scripts/collect_aisstream.py \
            --hours "$HOURS" \
            --flush-every 200 \
            --fail-if-empty \
            --empty-abort-after 1200 \
            --accepted-names deploy/accepted_names.json \
            --out-dir data/processed/ais_live \
            --status-out docs/data/aisstream_status.json \
            || collect_rc=$?

          if ! bash scripts/upload_live_shards.sh \
            data/processed/ais_live \
            docs/data/aisstream_status.json; then
            echo "::warning::in-step shard upload failed; always() step may retry"
          fi

          shopt -s nullglob
          files=(data/processed/ais_live/ais_*.parquet)
          echo "n_files=${#files[@]}" >> "$GITHUB_OUTPUT"

          # 143 = 128+SIGTERM if Python did not install a handler.
          if [ "$collect_rc" -eq 0 ] || [ "$collect_rc" -eq 143 ]; then
            exit 0
          fi
          exit "$collect_rc"

      - name: Upload live shards to Release
        if: ${{ always() && steps.key.outputs.present == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/upload_live_shards.sh \
            data/processed/ais_live \
            docs/data/aisstream_status.json

      # Status is the Release asset status.json (FishScraper ingest).
      # Do not commit docs/data/ — it is gitignored, and `git add` of an
      # ignored path exits 1 (failed run 34364047651 after a good upload).
