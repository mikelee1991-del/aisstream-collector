name: aisstream live collect

# Public repo. Single websocket at a time (free aisstream.io rejects
# overlaps with HTTP 429). Daytime SoCal fishing samples — not a
# near-continuous collector. Each cron collects SCHEDULE_HOURS (45 min)
# then exits green. ~3h/day vs the old 5×4h (~20h/day).
#
#   13:15 UTC  6:15 AM PDT / 5:15 AM PST  departures
#   17:15 UTC  10:15 AM PDT / 9:15 AM PST mid-morning
#   21:15 UTC  2:15 PM PDT / 1:15 PM PST  afternoon
#   00:15 UTC  5:15 PM PDT / 4:15 PM PST  returns
#
# cancel-in-progress still handoffs overlapping dispatch/push sessions.
# Shards land on Release tag aisstream-live for private FishScraper ingest.

on:
  schedule:
    - cron: "15 13 * * *"
    - cron: "15 17 * * *"
    - cron: "15 21 * * *"
    - cron: "15 0 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/aisstream-collect.yml"
      - "scripts/collect_aisstream.py"
      - "scripts/config.py"
      - "scripts/upload_live_shards.sh"
      - "deploy/accepted_names.json"
  pull_request:
    paths:
      - ".github/workflows/aisstream-collect.yml"
      - "scripts/collect_aisstream.py"
      - "scripts/config.py"
      - "scripts/upload_live_shards.sh"
      - "deploy/accepted_names.json"
  workflow_dispatch:
    inputs:
      hours:
        description: "Hours to collect (0 = until cancelled / step timeout). Scheduled runs use 0.75."
        required: false
        default: "0.75"

permissions:
  contents: write

concurrency:
  group: aisstream-collect
  cancel-in-progress: true

env:
  LIVE_RELEASE: aisstream-live
  AISSTREAM_HOST: github-actions-public
  # 45-minute fishing-day window. Step timeout stays above this so a
  # SIGTERM can still flush and the always() Release upload can run.
  SCHEDULE_HOURS: "0.75"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AISSTREAM_API_KEY
        id: key
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AISSTREAM_API_KEY}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add repo secret AISSTREAM_API_KEY (https://aisstream.io/ → API Keys). Collection skipped."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::AISSTREAM_API_KEY is not set."
              exit 1
            fi
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ steps.key.outputs.present == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        if: ${{ steps.key.outputs.present == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect live AIS
        id: collect
        # Step timeout (not job timeout) so always() upload can still run.
        timeout-minutes: 70
        if: ${{ steps.key.outputs.present == 'true' }}
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GitHub SIGTERMs the process group on cancel/preempt. Trap it in
          # bash so we survive long enough for Python to flush and for us to
          # upload. Run 34336864840 flushed 205 rows then skipped always()
          # upload, concluding failure and emailing "Run failed".
          on_term() {
            echo "step received SIGTERM; waiting for collector flush + upload…"
          }
          trap on_term TERM INT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            HOURS="${{ github.event.inputs.hours }}"
            HOURS="${HOURS:-0}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # Short live smoke so PRs prove collect+upload without a 45min wait.
            HOURS="0.05"
          else
            HOURS="${SCHEDULE_HOURS}"
          fi
          echo "collect hours=${HOURS} event=${{ github.event_name }}"

          mkdir -p data/processed/ais_live docs/data
          collect_rc=0
          python3 scripts/collect_aisstream.py \
            --hours "$HOURS" \
            --flush-every 200 \
            --fail-if-empty \
            --empty-abort-after 1200 \
            --accepted-names deploy/accepted_names.json \
            --out-dir data/processed/ais_live \
            --status-out docs/data/aisstream_status.json \
            || collect_rc=$?

          if ! bash scripts/upload_live_shards.sh \
            data/processed/ais_live \
            docs/data/aisstream_status.json; then
            echo "::warning::in-step shard upload failed; always() step may retry"
          fi

          shopt -s nullglob
          files=(data/processed/ais_live/ais_*.parquet)
          echo "n_files=${#files[@]}" >> "$GITHUB_OUTPUT"

          # 143 = 128+SIGTERM if Python did not install a handler.
          if [ "$collect_rc" -eq 0 ] || [ "$collect_rc" -eq 143 ]; then
            exit 0
          fi
          exit "$collect_rc"

      - name: Upload live shards to Release
        if: ${{ always() && steps.key.outputs.present == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/upload_live_shards.sh \
            data/processed/ais_live \
            docs/data/aisstream_status.json

      # Status is the Release asset status.json (FishScraper ingest).
      # Do not commit docs/data/ — it is gitignored, and `git add` of an
      # ignored path exits 1 (failed run 34364047651 after a good upload).
