name: aisstream live collect

# Public repo → free GitHub Actions minutes. Single websocket at a time
# (free aisstream.io rejects overlaps with HTTP 429). Scheduled runs collect
# for a bounded window then exit green. cancel-in-progress still handoffs
# overlapping dispatch/late-cron sessions. Shards land on Release tag
# aisstream-live for private FishScraper ingest to merge.

on:
  schedule:
    - cron: "15 */5 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/aisstream-collect.yml"
      - "scripts/collect_aisstream.py"
      - "scripts/config.py"
      - "scripts/upload_live_shards.sh"
      - "deploy/accepted_names.json"
  workflow_dispatch:
    inputs:
      hours:
        description: "Hours to collect this run (0 = until cancelled / step timeout)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: aisstream-collect
  cancel-in-progress: true

env:
  LIVE_RELEASE: aisstream-live
  AISSTREAM_HOST: github-actions-public
  # Finish before the 5h cron and before hosted-runner preemption (~4.5h)
  # that marked run 34336864840 as failure after skipping always() upload.
  SCHEDULE_HOURS: "4"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AISSTREAM_API_KEY
        id: key
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AISSTREAM_API_KEY}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add repo secret AISSTREAM_API_KEY (https://aisstream.io/ → API Keys). Collection skipped."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::AISSTREAM_API_KEY is not set."
              exit 1
            fi
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ steps.key.outputs.present == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        if: ${{ steps.key.outputs.present == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect live AIS
        id: collect
        # Step timeout (not job timeout) so always() upload can still run.
        timeout-minutes: 300
        if: ${{ steps.key.outputs.present == 'true' }}
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GitHub SIGTERMs the process group on cancel/preempt. Trap it in
          # bash so we survive long enough for Python to flush and for us to
          # upload. Run 34336864840 flushed 205 rows then skipped always()
          # upload, concluding failure and emailing "Run failed".
          on_term() {
            echo "step received SIGTERM; waiting for collector flush + upload…"
          }
          trap on_term TERM INT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            HOURS="${{ github.event.inputs.hours }}"
            HOURS="${HOURS:-0}"
          else
            HOURS="${SCHEDULE_HOURS}"
          fi
          echo "collect hours=${HOURS} event=${{ github.event_name }}"

          mkdir -p data/processed/ais_live docs/data
          collect_rc=0
          python3 scripts/collect_aisstream.py \
            --hours "$HOURS" \
            --flush-every 200 \
            --fail-if-empty \
            --empty-abort-after 1200 \
            --accepted-names deploy/accepted_names.json \
            --out-dir data/processed/ais_live \
            --status-out docs/data/aisstream_status.json \
            || collect_rc=$?

          if ! bash scripts/upload_live_shards.sh \
            data/processed/ais_live \
            docs/data/aisstream_status.json; then
            echo "::warning::in-step shard upload failed; always() step may retry"
          fi

          shopt -s nullglob
          files=(data/processed/ais_live/ais_*.parquet)
          echo "n_files=${#files[@]}" >> "$GITHUB_OUTPUT"

          # 143 = 128+SIGTERM if Python did not install a handler.
          if [ "$collect_rc" -eq 0 ] || [ "$collect_rc" -eq 143 ]; then
            exit 0
          fi
          exit "$collect_rc"

      - name: Upload live shards to Release
        if: ${{ always() && steps.key.outputs.present == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/upload_live_shards.sh \
            data/processed/ais_live \
            docs/data/aisstream_status.json

      - name: Commit collector status
        if: ${{ always() && steps.key.outputs.present == 'true' }}
        run: |
          set -euo pipefail
          if [ ! -f docs/data/aisstream_status.json ]; then
            echo "No status file."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/aisstream_status.json
          if git diff --cached --quiet; then
            echo "Status unchanged."
            exit 0
          fi
          git commit -m "chore: update aisstream collector status"
          git pull --rebase origin "${GITHUB_REF_NAME}" || git pull --rebase origin main || true
          git push || git push origin "HEAD:${GITHUB_REF_NAME}"
